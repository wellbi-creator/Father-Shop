<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Father Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0a1f;--card:#1b1533;--card2:#262046;--line:rgba(167,139,250,.2);--acc:#8b5cf6;--soft:#c4b5fd;--ink:#f5f1ff;--mut:#a99bd0;
--btn:linear-gradient(135deg,#a78bfa,#7c3aed 60%,#6d28d9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;padding:14px 14px 130px;min-height:100vh;color:var(--ink);font:15px/1.4 Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(700px 380px at 90% -5%,rgba(124,58,237,.35),transparent 65%),var(--bg) fixed}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
button{padding:11px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.primary{background:var(--btn);border:0;box-shadow:0 8px 20px rgba(124,58,237,.45),inset 0 1px 0 rgba(255,255,255,.3)}
button.danger{color:#ff9fb0}
button.big{width:100%;padding:15px;font-size:16px}
button:disabled{opacity:.6}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor}
.sw{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 16px;border:2px solid var(--acc);border-radius:20px;background:var(--card);box-shadow:0 0 22px rgba(139,92,246,.35)}
.sw input,.sw input:focus{border:0;background:none;padding:10px 0;outline:none}
.sw button{width:46px;height:46px;padding:0;border-radius:14px;display:flex;align-items:center;justify-content:center}
.frow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
#fbtn{display:flex;gap:8px;align-items:center;padding:12px 18px;border-radius:999px}
#fbtn.on{border-color:var(--acc);color:var(--soft)}
#count{color:var(--mut)}#count b{font-size:24px;color:var(--ink);font-weight:800}
.chips{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 6px}.chips.wrap{flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;white-space:nowrap;padding:10px 10px;font-size:14px;border-radius:999px;background:transparent;color:var(--mut)}
.chip .i{width:18px;height:18px}
.chip.on{color:var(--soft);border-color:var(--acc);background:rgba(139,92,246,.18);box-shadow:0 0 14px rgba(139,92,246,.35)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.card{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{position:relative;cursor:pointer}
.pic{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.noimg{display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(160deg,#2d2358,#1b1533)}
.bd{position:absolute;top:10px;left:10px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(255,255,255,.9);color:#2b1d5c}
.bd.new{background:var(--btn);color:#fff}
.meta{display:flex;gap:4px;padding:12px 8px 4px 12px}
.mt{flex:1;min-width:0}
.cprice{font-weight:800;font-size:19px}
.ctitle{color:#e9e2ff;margin-top:2px;overflow-wrap:anywhere;cursor:pointer}
.sub{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:13px;margin-top:4px}.sub .i{width:14px;height:14px}
.hrt{width:38px;height:38px;padding:0;border:0;background:none;color:var(--soft);display:flex;align-items:center;justify-content:center}
.hrt.on{color:#c084fc}
.buy{display:flex;align-items:center;gap:8px;padding:8px 12px 12px;margin-top:auto}
.buy button{flex:1;padding:10px}.qty{min-width:22px;text-align:center;font-weight:800}
.empty{text-align:center;color:var(--mut);margin:50px 0;display:grid;gap:14px;justify-items:center}
.pt{margin:6px 0 14px;font-size:24px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
background:rgba(20,14,40,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{position:relative;display:grid;justify-items:center;gap:3px;padding:8px 0;border:0;border-radius:16px;background:none;color:var(--mut);font-size:12px}
.tab .i{width:26px;height:26px}.tab.on{background:rgba(139,92,246,.22);color:var(--soft)}
.bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--btn);color:#fff;font-size:11px;line-height:18px;font-weight:800}
#cartBar{position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:15;padding:10px 10px 10px 18px;border-radius:20px;
display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(38,32,70,.95);border:1px solid var(--acc);box-shadow:0 10px 30px rgba(0,0,0,.45)}
#cartInfo{font-weight:800}
[hidden]{display:none!important}
dialog{width:100%;max-width:520px;max-height:92vh;margin:auto auto 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-bottom:0;
border-radius:26px 26px 0 0;background:linear-gradient(180deg,#221a45,#150f2e);color:var(--ink);overflow:auto}
dialog[open]{animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}}
dialog::backdrop{background:rgba(5,2,18,.7)}
dialog h2{margin:0 0 12px;font-weight:800}
.bigpic{width:100%;max-height:44vh;object-fit:cover;border-radius:18px;display:block}
.bigpic.noimg{display:flex;height:180px;font-size:80px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;color:#dcd2ff}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.total{font-size:18px;font-weight:800}
label{font-size:13px;color:var(--mut);display:grid;gap:5px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.item .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.item img,.item .th{width:52px;height:52px;border-radius:12px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--card2);flex:none}
.item button{padding:8px 12px}
.qtyb{display:flex;align-items:center;gap:8px}
.ok{text-align:center;padding:16px 0}.ok .big2{font-size:60px}
.ava{width:84px;height:84px;border-radius:50%;background:var(--btn);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;margin:10px auto}
.center{text-align:center}
</style>
</head>
<body>
<section id="catTop">
  <div class="sw"><input id="q" type="text" enterkeyhint="search" placeholder="Найти товар…" autocomplete="off"><button class="primary" data-act="search" aria-label="Поиск" id="sbtn"></button></div>
  <div class="frow"><button id="fbtn" data-act="filters"></button><div id="count"></div></div>
  <div class="chips" id="chips"></div>
</section>
<main id="page"></main>
<div id="cartBar" hidden><span id="cartInfo"></span><button class="primary" data-tab="cart">Корзина</button></div>
<nav id="nav"></nav>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script>
/* ================== НАСТРОЙКИ ================== */
const ADMIN_ID = 6939657131;
const API_URL  = "https://shop.dalerolimjanov271.workers.dev";
const CURRENCY = "₽";
const DEFAULTS = [
  {id:1,title:"Футболка базовая",price:1490,emoji:"👕",image:"",badge:"Новый",sub:"В наличии",description:"Хлопок 100%. Размеры S–XL.\nЦвета: белый, чёрный."},
  {id:2,title:"Кружка керамическая",price:590,emoji:"☕",image:"",badge:"Новый",sub:"В наличии",description:"Объём 350 мл. Можно в посудомойку."},
  {id:3,title:"Худи оверсайз",price:3990,emoji:"🧥",image:"",badge:"",sub:"В наличии",description:"Плотный футер с начесом."},
  {id:4,title:"Рюкзак городской",price:2790,emoji:"🎒",image:"",badge:"",sub:"В наличии",description:"Отделение для ноутбука до 15\"."},
  {id:5,title:"Блокнот А5",price:350,emoji:"📓",image:"",badge:"",sub:"В наличии",description:"120 листов в точку."},
  {id:6,title:"Бутылка для воды",price:890,emoji:"🧴",image:"",badge:"",sub:"В наличии",description:"Сталь, держит тепло 12 часов."}
];
/* ================================================= */

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{tg.setHeaderColor("#0e0a1f");tg.setBackgroundColor("#0e0a1f");}catch(e){} }
const $ = id => document.getElementById(id);
const demo = API_URL.includes("YOUR-WORKER");
const initData = (tg && tg.initData) || "";
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const isAdmin = !!user && user.id === ADMIN_ID;

let PRODUCTS = [...DEFAULTS], tab = "cat", sortBy = "new", Q = "", curItem = null;
let F = {min: "", max: "", badges: new Set()};
const cart = new Map(), fav = new Set();
try { JSON.parse(localStorage.getItem("fav") || "[]").forEach(x => fav.add(x)); } catch (e) {}
const saveFav = () => { try { localStorage.setItem("fav", JSON.stringify([...fav])); } catch (e) {} };

const ICONS = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  filter: '<path d="M4 6h16M7 12h10M10 18h4"/>',
  pin: '<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  spark: '<path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  down: '<path d="M12 5v14M5 12l7 7 7-7"/>'
};
const ic = (n, f) => `<svg class="i${f ? " f" : ""}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const money = n => Number(n).toLocaleString("ru-RU") + " " + CURRENCY;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = m => (tg && tg.showAlert) ? tg.showAlert(m) : alert(m);
const ask = (m, cb) => (tg && tg.showConfirm) ? tg.showConfirm(m, ok => ok && cb()) : (confirm(m) && cb());
const plural = n => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "товар" : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? "товара" : "товаров"; };
const pic = (p, cls) => p.image ? `<img class="${cls}" src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">` : `<div class="${cls} noimg">${esc(p.emoji || "🛍")}</div>`;
const thumb = p => p.image ? `<img src="${esc(p.image)}" alt="">` : `<div class="th">${esc(p.emoji || "🛍")}</div>`;
const badge = p => p.badge ? `<span class="bd${p.badge.trim().toLowerCase() === "новый" ? " new" : ""}">${esc(p.badge)}</span>` : "";

async function api(path, body) {
  const r = await fetch(API_URL + path, {method: body ? "POST" : "GET", headers: {"Content-Type": "application/json"}, body: body && JSON.stringify({initData, ...body})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Ошибка сервера");
  return d;
}

function visible() {
  const q = Q.trim().toLowerCase(), mn = parseFloat(F.min), mx = parseFloat(F.max);
  let l = PRODUCTS.filter(p => (p.title + " " + (p.description || "")).toLowerCase().includes(q)
    && (isNaN(mn) || p.price >= mn) && (isNaN(mx) || p.price <= mx) && (!F.badges.size || F.badges.has((p.badge || "").trim())));
  if (sortBy === "asc") l.sort((a, b) => a.price - b.price);
  else if (sortBy === "desc") l.sort((a, b) => b.price - a.price);
  else l.sort((a, b) => b.id - a.id);
  return l;
}

function card(p) {
  const n = cart.get(p.id) || 0, f = fav.has(p.id);
  return `<div class="card"><div class="ph" data-open="${p.id}">${pic(p, "pic")}${badge(p)}</div>
    <div class="meta"><div class="mt"><div class="cprice">${money(p.price)}</div><div class="ctitle" data-open="${p.id}">${esc(p.title)}</div>
    ${p.sub ? `<div class="sub">${ic("pin")}<span>${esc(p.sub)}</span></div>` : ""}</div>
    <button class="hrt${f ? " on" : ""}" data-fav="${p.id}" aria-label="В избранное">${ic("heart", f)}</button></div>
    <div class="buy">${n ? `<button data-dec="${p.id}">−</button><span class="qty">${n}</span><button data-inc="${p.id}">+</button>`
    : `<button class="primary" data-inc="${p.id}">В корзину</button>`}</div></div>`;
}

function cartView() {
  if (!cart.size) return `<h2 class="pt">Корзина</h2><div class="empty"><p>Здесь пока пусто</p><button class="primary" data-tab="cat">Перейти в каталог</button></div>`;
  let total = 0;
  const rows = [...cart].map(([id, n]) => { const p = PRODUCTS.find(x => x.id === id); total += p.price * n;
    return `<div class="item">${thumb(p)}<div class="t">${esc(p.title)}<br><b>${money(p.price * n)}</b></div>
      <div class="qtyb"><button data-dec="${id}">−</button><span class="qty">${n}</span><button data-inc="${id}">+</button></div></div>`; }).join("");
  return `<h2 class="pt">Корзина</h2><div class="stack">${rows}<div class="line total"><span>Итого</span><span>${money(total)}</span></div>
    <button class="primary big" data-act="checkout">Оформить заказ</button></div>`;
}

function profileView() {
  const name = user ? [user.first_name, user.last_name].filter(Boolean).join(" ") : "Гость";
  return `<div class="center"><div class="ava">${esc(name.charAt(0).toUpperCase())}</div><h2 class="pt" style="margin-bottom:4px">${esc(name)}</h2>
    <p class="desc">${user && user.username ? "@" + esc(user.username) : ""}</p></div>
    <div class="stack" style="margin-top:16px">
    ${isAdmin ? `<button class="primary big" data-act="admin">Управление каталогом</button><p class="desc center" style="font-size:13px;color:var(--mut)">Эта кнопка видна только вам</p>`
    : `<p class="desc center">Оформите заказ в корзине — менеджер свяжется с вами по указанному телефону.</p>`}</div>`;
}

function render() {
  let count = 0, total = 0;
  for (const [id, n] of cart) { const p = PRODUCTS.find(x => x.id === id); if (p) { count += n; total += p.price * n; } else cart.delete(id); }
  $("catTop").hidden = tab !== "cat";
  let h = "";
  if (tab === "cat") {
    const l = visible();
    $("count").innerHTML = `<b>${l.length}</b> ${plural(l.length)}`;
    h = l.length ? `<div class="grid">${l.map(card).join("")}</div>` : `<p class="empty">Ничего не найдено</p>`;
  } else if (tab === "fav") {
    const l = PRODUCTS.filter(p => fav.has(p.id));
    h = `<h2 class="pt">Избранное</h2>` + (l.length ? `<div class="grid">${l.map(card).join("")}</div>` : `<p class="empty">Нажмите ♡ на товаре, чтобы сохранить его здесь</p>`);
  } else h = tab === "cart" ? cartView() : profileView();
  $("page").innerHTML = h;
  $("chips").innerHTML = [["new", "spark", "Новинки"], ["asc", "up", "Дешевле"], ["desc", "down", "Дороже"]]
    .map(([k, i, t]) => `<button class="chip${sortBy === k ? " on" : ""}" data-sort="${k}">${ic(i)}${t}</button>`).join("");
  $("fbtn").classList.toggle("on", !!(F.min || F.max || F.badges.size));
  $("nav").innerHTML = [["cat", "home", "Каталог"], ["fav", "heart", "Избранное"], ["cart", "cart", "Корзина"], ["me", "user", "Профиль"]]
    .map(([k, i, t]) => `<button class="tab${tab === k ? " on" : ""}" data-tab="${k}">${ic(i)}<span>${t}</span>
    ${k === "cart" && count ? `<span class="bdg">${count}</span>` : ""}${k === "fav" && fav.size ? `<span class="bdg">${fav.size}</span>` : ""}</button>`).join("");
  $("cartBar").hidden = !(count && tab === "cat");
  $("cartInfo").textContent = `${count} шт. · ${money(total)}`;
}

function change(id, d) {
  const n = Math.max(0, Math.min(99, (cart.get(id) || 0) + d));
  n ? cart.set(id, n) : cart.delete(id);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  render();
}

const show = html => { $("dbody").innerHTML = html; if (!$("dlg").open) { $("dlg").showModal(); if (document.activeElement) document.activeElement.blur(); } };
const close = () => $("dlg").close();

function openItem(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  curItem = id; const f = fav.has(id);
  show(`<div class="ph" style="cursor:default">${pic(p, "bigpic")}${badge(p)}</div>
    <div class="meta" style="padding:12px 0 0"><div class="mt"><div class="cprice" style="font-size:24px">${money(p.price)}</div>
    <div style="font-weight:700;font-size:17px;margin-top:2px">${esc(p.title)}</div>${p.sub ? `<div class="sub">${ic("pin")}<span>${esc(p.sub)}</span></div>` : ""}</div>
    <button class="hrt${f ? " on" : ""}" data-fav="${id}" aria-label="В избранное">${ic("heart", f)}</button></div>
    <p class="desc">${esc(p.description)}</p>
    <div class="row"><button id="x">Закрыть</button><button class="primary" id="add">В корзину</button></div>`);
  $("x").onclick = close; $("add").onclick = () => { change(id, 1); close(); };
}

function openFilters() {
  const bs = [...new Set(PRODUCTS.map(p => (p.badge || "").trim()).filter(Boolean))];
  show(`<h2>Фильтры</h2><div class="stack">
    <div class="row"><label>Цена от<input id="f_min" type="number" inputmode="numeric" value="${esc(F.min)}"></label>
    <label>до<input id="f_max" type="number" inputmode="numeric" value="${esc(F.max)}"></label></div>
    ${bs.length ? `<label>Метка</label><div class="chips wrap">${bs.map(b => `<button class="chip${F.badges.has(b) ? " on" : ""}" data-b="${esc(b)}">${esc(b)}</button>`).join("")}</div>` : ""}
    <div class="row"><button id="fr">Сбросить</button><button class="primary" id="fa">Показать</button></div></div>`);
  $("fr").onclick = () => { F = {min: "", max: "", badges: new Set()}; close(); render(); };
  $("fa").onclick = () => { F.min = $("f_min").value; F.max = $("f_max").value; close(); render(); };
}

/* ---------- Оформление заказа ---------- */
function openCheckout() {
  if (!cart.size) return;
  let total = 0;
  const lines = [...cart].map(([id, n]) => { const p = PRODUCTS.find(x => x.id === id); total += p.price * n;
    return `<div class="line"><span>${esc(p.title)} × ${n}</span><b>${money(p.price * n)}</b></div>`; }).join("");
  const name = user ? [user.first_name, user.last_name].filter(Boolean).join(" ") : "";
  show(`<h2>Оформление заказа</h2>${lines}<div class="line total"><span>Итого</span><span>${money(total)}</span></div>
    <div class="stack" style="margin-top:12px">
      <label>Ваше имя<input id="f_name" value="${esc(name)}" autocomplete="name"></label>
      <label>Телефон для связи<input id="f_phone" type="tel" placeholder="+7 900 000-00-00" autocomplete="tel"></label>
      <label>Адрес доставки<textarea id="f_addr" rows="2" placeholder="Город, улица, дом, квартира"></textarea></label>
      <label>Комментарий (необязательно)<textarea id="f_note" rows="2"></textarea></label>
      <div class="row"><button id="x">Назад</button><button class="primary" id="send">Отправить заказ</button></div></div>`);
  $("x").onclick = close;
  $("send").onclick = async () => {
    const o = {name: $("f_name").value.trim(), phone: $("f_phone").value.trim(), address: $("f_addr").value.trim(), comment: $("f_note").value.trim(),
      items: [...cart].map(([id, qty]) => { const p = PRODUCTS.find(x => x.id === id); return {id, qty, title: p.title, price: p.price}; })};
    if (!o.name) return say("Укажите имя");
    if (o.phone.replace(/\D/g, "").length < 6) return say("Укажите телефон для связи");
    if (!o.address) return say("Укажите адрес доставки");
    $("send").disabled = true; $("send").textContent = "Отправляем…";
    try {
      if (!demo) await api("/order", {order: o});
      cart.clear(); render();
      show(`<div class="ok"><div class="big2">✅</div><h2>Заказ отправлен</h2><p class="desc">Мы свяжемся с вами по указанному телефону.</p>
        <button class="primary big" id="x">Готово</button></div>`);
      $("x").onclick = close;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } catch (e) { say("Не удалось отправить заказ: " + e.message); $("send").disabled = false; $("send").textContent = "Отправить заказ"; }
  };
}

/* ---------- Админ-панель ---------- */
function openAdmin() {
  show(`<h2>Каталог товаров</h2><div class="stack">
    ${PRODUCTS.map(p => `<div class="item">${thumb(p)}<div class="t">${esc(p.title)}<br><small style="color:var(--mut)">${money(p.price)}</small></div>
      <button data-edit="${p.id}">Изменить</button></div>`).join("") || "<p class='desc'>Товаров пока нет</p>"}
    <button class="primary" data-edit="new">+ Добавить товар</button><button id="x">Закрыть</button></div>`);
  $("x").onclick = close;
}

function toData(file) {
  return new Promise((res, rej) => { const im = new Image();
    im.onload = () => { const k = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .78)); };
    im.onerror = () => rej(new Error("Не удалось прочитать фото")); im.src = URL.createObjectURL(file); });
}

async function saveCatalog(list) {
  if (!demo) await api("/catalog", {products: list});
  PRODUCTS = list; render();
}

function openEdit(id) {
  const isNew = id === "new";
  const p = isNew ? {title: "", price: "", emoji: "🛍", image: "", badge: "", sub: "", description: ""} : PRODUCTS.find(x => x.id === +id);
  let img = p.image;
  show(`<h2>${isNew ? "Новый товар" : "Редактирование"}</h2><div class="stack">
    <div id="prev">${pic({...p, image: img}, "bigpic")}</div>
    <label>Фото с телефона<input id="e_file" type="file" accept="image/*"></label>
    <label>или ссылка на фото<input id="e_url" value="${esc(p.image && p.image.startsWith("data:") ? "" : p.image)}" placeholder="https://…"></label>
    <label>Название<input id="e_title" value="${esc(p.title)}"></label>
    <label>Цена, ${CURRENCY}<input id="e_price" type="number" inputmode="decimal" value="${esc(p.price)}"></label>
    <div class="row"><label>Метка на фото<input id="e_badge" value="${esc(p.badge)}" placeholder="Новый, Б/У…"></label>
    <label>Подпись (город)<input id="e_sub" value="${esc(p.sub)}" placeholder="Москва"></label></div>
    <label>Эмодзи (если нет фото)<input id="e_emoji" value="${esc(p.emoji)}"></label>
    <label>Описание<textarea id="e_desc" rows="3">${esc(p.description)}</textarea></label>
    <button class="primary" id="save">Сохранить</button>
    ${isNew ? "" : `<button class="danger" id="del">Удалить товар</button>`}<button id="back">Назад</button></div>`);
  const prev = () => $("prev").innerHTML = pic({title: "", emoji: $("e_emoji").value, image: img}, "bigpic");
  $("back").onclick = openAdmin;
  $("e_file").onchange = async e => { const f = e.target.files[0]; if (!f) return;
    try { img = await toData(f); $("e_url").value = ""; prev(); } catch (er) { say(er.message); } };
  $("e_url").oninput = e => { img = e.target.value.trim(); prev(); };
  $("save").onclick = async () => {
    const t = $("e_title").value.trim(), pr = parseFloat($("e_price").value);
    if (!t || !(pr >= 0)) return say("Укажите название и цену");
    const item = {id: isNew ? Date.now() : p.id, title: t, price: pr, emoji: $("e_emoji").value.trim(), image: img,
      badge: $("e_badge").value.trim(), sub: $("e_sub").value.trim(), description: $("e_desc").value.trim()};
    const list = isNew ? [...PRODUCTS, item] : PRODUCTS.map(x => x.id === p.id ? item : x);
    $("save").disabled = true;
    try { await saveCatalog(list); openAdmin(); } catch (e) { say("Не сохранилось: " + e.message); $("save").disabled = false; }
  };
  if (!isNew) $("del").onclick = () => ask("Удалить «" + p.title + "»?", async () => {
    try { await saveCatalog(PRODUCTS.filter(x => x.id !== p.id)); openAdmin(); } catch (e) { say("Не удалилось: " + e.message); }
  });
}

/* ---------- События ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-inc],[data-dec],[data-fav],[data-act],[data-sort],[data-tab],[data-b],[data-edit]");
  if (!t) { if (e.target === $("dlg")) close(); return; }
  const d = t.dataset;
  if (d.tab) { tab = d.tab; window.scrollTo(0, 0); render(); }
  else if (d.sort) { sortBy = d.sort; render(); }
  else if (d.open) openItem(+d.open);
  else if (d.inc) change(+d.inc, 1);
  else if (d.dec) change(+d.dec, -1);
  else if (d.fav) {
    const id = +d.fav; fav.has(id) ? fav.delete(id) : fav.add(id); saveFav();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    render(); if ($("dlg").open && curItem === id) openItem(id);
  }
  else if (d.b !== undefined) { F.badges.has(d.b) ? F.badges.delete(d.b) : F.badges.add(d.b); t.classList.toggle("on"); }
  else if (d.edit) openEdit(d.edit);
  else if (d.act === "filters") openFilters();
  else if (d.act === "checkout") openCheckout();
  else if (d.act === "admin" && isAdmin) openAdmin();
  else if (d.act === "search") $("q").blur();
});
$("q").addEventListener("input", e => { Q = e.target.value; render(); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
$("dlg").addEventListener("close", () => { curItem = null; });
$("sbtn").innerHTML = ic("search");
$("fbtn").innerHTML = ic("filter") + "Фильтры";

render();
if (!demo) api("/catalog").then(d => { if (Array.isArray(d.products)) { PRODUCTS = d.products; render(); } }).catch(() => {});
</script>
</body>
</html>
