<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--mut:#a9c3f5;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.18);
--btn:linear-gradient(135deg,#5bb2ff,#2f6bff 60%,#1f4fe0);--deep:#0b2370}
*{box-sizing:border-box}
html{background:#0a1f5c}
body{margin:0;padding:0 14px 96px;min-height:100vh;color:var(--ink);
font:15px/1.4 Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(900px 500px at 85% -10%,#3a8bff 0,transparent 60%),linear-gradient(170deg,#0a1f5c,#123aa8 55%,#1d5fe0) fixed}
header{position:sticky;top:0;z-index:5;padding:14px 0 10px;display:grid;gap:10px;
background:linear-gradient(#0a1f5c 60%,transparent)}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;
background:rgba(255,255,255,.1);color:var(--ink);font:inherit}
select option{color:#111}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,select:focus,textarea:focus{outline:2px solid #7cc0ff;outline-offset:1px}
button{padding:11px 16px;border:1px solid var(--line);border-radius:14px;background:var(--glass);
color:var(--ink);font:inherit;font-weight:600;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.primary{background:var(--btn);border:0;box-shadow:0 8px 20px rgba(31,79,224,.45),inset 0 1px 0 rgba(255,255,255,.35)}
button.danger{color:#ffb4b4}
.round{width:42px;height:42px;padding:0;border-radius:50%;font-size:18px}
.row{display:flex;gap:8px}.row>*{flex:1}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;overflow:hidden;
display:flex;flex-direction:column;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pic{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
.noimg{display:flex;align-items:center;justify-content:center;font-size:52px;background:rgba(255,255,255,.08)}
.cbody{padding:11px;display:grid;gap:7px;flex:1;align-content:start}
.ctitle{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.cprice{font-weight:800;font-size:17px;color:#cfe3ff}
.buy{display:flex;align-items:center;gap:8px}
.buy button{flex:1;padding:9px}.qty{min-width:24px;text-align:center;font-weight:800}
#empty{text-align:center;color:var(--mut);margin-top:40px}
#cartBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;
padding:10px 10px 10px 18px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;
background:rgba(10,31,92,.82);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
box-shadow:0 10px 30px rgba(0,0,0,.35)}
#cartInfo{font-weight:800}
[hidden]{display:none!important}
dialog{width:min(94vw,480px);max-height:90vh;padding:18px;border:1px solid var(--line);border-radius:24px;
background:linear-gradient(170deg,#12348f,#0b2370);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(3,10,40,.65)}
dialog h2,dialog h3{margin:0 0 10px;font-weight:800}
.bigpic{width:100%;max-height:46vh;object-fit:cover;border-radius:16px;display:block}
.bigpic.noimg{height:170px;font-size:76px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;color:#dbe8ff}
.stack{display:grid;gap:10px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.total{font-size:18px;font-weight:800}
label{font-size:13px;color:var(--mut);display:grid;gap:5px}
.item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--glass)}
.item .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.item img,.item .th{width:46px;height:46px;border-radius:10px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(255,255,255,.1)}
.item button{padding:8px 11px}
.ok{text-align:center;padding:20px 0}.ok .big{font-size:60px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Магазин</h1><button id="adminBtn" class="round" hidden aria-label="Админ-панель">⚙️</button></div>
  <input id="q" type="search" placeholder="Поиск товара…" autocomplete="off">
  <select id="sort">
    <option value="new">По умолчанию</option>
    <option value="price_asc">Сначала дешевле</option>
    <option value="price_desc">Сначала дороже</option>
  </select>
</header>
<main id="grid"></main>
<p id="empty" hidden>Ничего не найдено</p>
<div id="cartBar" hidden><span id="cartInfo"></span><button id="orderBtn" class="primary">Оформить заказ</button></div>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script>
/* ================== НАСТРОЙКИ ================== */
const ADMIN_ID = 6939657131;                          // ваш Telegram ID — только вы видите админ-панель
const API_URL  = "https://YOUR-WORKER.workers.dev";   // адрес вашего сервера (см. инструкцию, файл worker.js)
const CURRENCY = "₽";
const DEFAULTS = [
  {id:1,title:"Футболка базовая",price:1490,emoji:"👕",image:"",description:"Хлопок 100%. Размеры S–XL.\nЦвета: белый, чёрный."},
  {id:2,title:"Кружка керамическая",price:590,emoji:"☕",image:"",description:"Объём 350 мл. Можно в посудомойку."},
  {id:3,title:"Худи оверсайз",price:3990,emoji:"🧥",image:"",description:"Плотный футер с начесом."},
  {id:4,title:"Рюкзак городской",price:2790,emoji:"🎒",image:"",description:"Отделение для ноутбука до 15\"."},
  {id:5,title:"Блокнот А5",price:350,emoji:"📓",image:"",description:"120 листов в точку."},
  {id:6,title:"Бутылка для воды",price:890,emoji:"🧴",image:"",description:"Сталь, держит тепло 12 часов."}
];
/* ================================================= */

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{tg.setHeaderColor("#0a1f5c");tg.setBackgroundColor("#0a1f5c");}catch(e){} }
const $ = id => document.getElementById(id);
const demo = API_URL.includes("YOUR-WORKER");
const initData = (tg && tg.initData) || "";
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const isAdmin = !!user && user.id === ADMIN_ID;
let PRODUCTS = [...DEFAULTS];
const cart = new Map();

const money = n => Number(n).toLocaleString("ru-RU") + " " + CURRENCY;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = m => (tg && tg.showAlert) ? tg.showAlert(m) : alert(m);
const pic = (p, cls) => p.image ? `<img class="${cls}" src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`
  : `<div class="${cls} noimg">${esc(p.emoji || "🛍")}</div>`;

async function api(path, body) {
  const r = await fetch(API_URL + path, {method: body ? "POST" : "GET", headers: {"Content-Type": "application/json"},
    body: body && JSON.stringify({initData, ...body})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Ошибка сервера");
  return d;
}

function render() {
  const q = $("q").value.trim().toLowerCase(), s = $("sort").value;
  let list = PRODUCTS.filter(p => (p.title + " " + (p.description || "")).toLowerCase().includes(q));
  if (s === "price_asc") list = [...list].sort((a, b) => a.price - b.price);
  if (s === "price_desc") list = [...list].sort((a, b) => b.price - a.price);
  $("empty").hidden = list.length > 0;
  $("grid").innerHTML = list.map(p => {
    const n = cart.get(p.id) || 0;
    return `<div class="card"><div data-open="${p.id}">${pic(p, "pic")}</div><div class="cbody">
      <div class="ctitle" data-open="${p.id}">${esc(p.title)}</div><div class="cprice">${money(p.price)}</div>
      <div class="buy">${n ? `<button data-dec="${p.id}">−</button><span class="qty">${n}</span><button data-inc="${p.id}">+</button>`
      : `<button class="primary" data-inc="${p.id}">В корзину</button>`}</div></div></div>`;
  }).join("");
  let count = 0, total = 0;
  for (const [id, q2] of cart) { const p = PRODUCTS.find(x => x.id === id); if (p) { count += q2; total += p.price * q2; } else cart.delete(id); }
  $("cartBar").hidden = !count;
  $("cartInfo").textContent = `${count} шт. · ${money(total)}`;
}

function change(id, d) {
  const n = Math.max(0, Math.min(99, (cart.get(id) || 0) + d));
  n ? cart.set(id, n) : cart.delete(id);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  render();
}

const show = html => { $("dbody").innerHTML = html; if (!$("dlg").open) $("dlg").showModal(); };
const close = () => $("dlg").close();

function openItem(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  show(`${pic(p, "bigpic")}<h3 style="margin-top:12px">${esc(p.title)}</h3><div class="cprice">${money(p.price)}</div>
    <p class="desc">${esc(p.description)}</p>
    <div class="row"><button id="x">Закрыть</button><button class="primary" id="add">В корзину</button></div>`);
  $("x").onclick = close; $("add").onclick = () => { change(id, 1); close(); };
}

/* ---------- Оформление заказа ---------- */
function openCheckout() {
  let total = 0;
  const lines = [...cart].map(([id, n]) => { const p = PRODUCTS.find(x => x.id === id); total += p.price * n;
    return `<div class="line"><span>${esc(p.title)} × ${n}</span><b>${money(p.price * n)}</b></div>`; }).join("");
  const name = user ? [user.first_name, user.last_name].filter(Boolean).join(" ") : "";
  show(`<h2>Оформление заказа</h2>${lines}<div class="line total"><span>Итого</span><span>${money(total)}</span></div>
    <div class="stack" style="margin-top:12px">
      <label>Ваше имя<input id="f_name" value="${esc(name)}" autocomplete="name"></label>
      <label>Телефон для связи<input id="f_phone" type="tel" placeholder="+7 900 000-00-00" autocomplete="tel"></label>
      <label>Адрес доставки<textarea id="f_addr" rows="2" placeholder="Город, улица, дом, квартира"></textarea></label>
      <label>Комментарий (необязательно)<textarea id="f_note" rows="2"></textarea></label>
      <div class="row"><button id="x">Назад</button><button class="primary" id="send">Отправить заказ</button></div>
    </div>`);
  $("x").onclick = close;
  $("send").onclick = async () => {
    const o = {name: $("f_name").value.trim(), phone: $("f_phone").value.trim(), address: $("f_addr").value.trim(), comment: $("f_note").value.trim(),
      items: [...cart].map(([id, qty]) => { const p = PRODUCTS.find(x => x.id === id); return {id, qty, title: p.title, price: p.price}; })};
    if (!o.name) return say("Укажите имя");
    if (o.phone.replace(/\D/g, "").length < 6) return say("Укажите телефон для связи");
    if (!o.address) return say("Укажите адрес доставки");
    $("send").disabled = true; $("send").textContent = "Отправляем…";
    try {
      if (!demo) await api("/order", {order: o});
      cart.clear(); render();
      show(`<div class="ok"><div class="big">✅</div><h2>Заказ отправлен</h2><p class="desc">Мы свяжемся с вами по указанному телефону.</p>
        <button class="primary" id="x" style="width:100%">Готово</button></div>`);
      $("x").onclick = close;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } catch (e) { say("Не удалось отправить заказ: " + e.message); $("send").disabled = false; $("send").textContent = "Отправить заказ"; }
  };
}

/* ---------- Админ-панель ---------- */
function openAdmin() {
  show(`<h2>Каталог товаров</h2><div class="stack">
    ${PRODUCTS.map(p => `<div class="item">${p.image ? `<img src="${esc(p.image)}" alt="">` : `<div class="th">${esc(p.emoji || "🛍")}</div>`}
      <div class="t">${esc(p.title)}<br><small style="color:var(--mut)">${money(p.price)}</small></div>
      <button data-edit="${p.id}">Изменить</button></div>`).join("") || "<p class='desc'>Товаров пока нет</p>"}
    <button class="primary" data-edit="new">+ Добавить товар</button><button id="x">Закрыть</button></div>`);
  $("x").onclick = close;
}

function toData(file) {
  return new Promise((res, rej) => { const im = new Image();
    im.onload = () => { const k = Math.min(1, 700 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .78)); };
    im.onerror = () => rej(new Error("Не удалось прочитать фото")); im.src = URL.createObjectURL(file); });
}

async function saveCatalog(list) {
  if (!demo) await api("/catalog", {products: list});
  PRODUCTS = list; render();
}

function openEdit(id) {
  const isNew = id === "new";
  const p = isNew ? {title: "", price: "", emoji: "🛍", image: "", description: ""} : PRODUCTS.find(x => x.id === +id);
  let img = p.image;
  show(`<h2>${isNew ? "Новый товар" : "Редактирование"}</h2><div class="stack">
    <div id="prev">${pic({...p, image: img}, "bigpic")}</div>
    <label>Фото с телефона<input id="e_file" type="file" accept="image/*"></label>
    <label>или ссылка на фото<input id="e_url" value="${esc(p.image && p.image.startsWith("data:") ? "" : p.image)}" placeholder="https://…"></label>
    <label>Название<input id="e_title" value="${esc(p.title)}"></label>
    <label>Цена, ${CURRENCY}<input id="e_price" type="number" inputmode="decimal" value="${esc(p.price)}"></label>
    <label>Эмодзи (если нет фото)<input id="e_emoji" value="${esc(p.emoji)}"></label>
    <label>Описание<textarea id="e_desc" rows="3">${esc(p.description)}</textarea></label>
    <button class="primary" id="save">Сохранить</button>
    ${isNew ? "" : `<button class="danger" id="del">Удалить товар</button>`}<button id="back">Назад</button></div>`);
  const prev = () => $("prev").innerHTML = pic({title: "", emoji: $("e_emoji").value, image: img}, "bigpic");
  $("back").onclick = openAdmin;
  $("e_file").onchange = async e => { const f = e.target.files[0]; if (!f) return;
    try { img = await toData(f); $("e_url").value = ""; prev(); } catch (er) { say(er.message); } };
  $("e_url").oninput = e => { img = e.target.value.trim(); prev(); };
  $("save").onclick = async () => {
    const t = $("e_title").value.trim(), pr = parseFloat($("e_price").value);
    if (!t || !(pr >= 0)) return say("Укажите название и цену");
    const item = {id: isNew ? Date.now() : p.id, title: t, price: pr, emoji: $("e_emoji").value.trim(), image: img, description: $("e_desc").value.trim()};
    const list = isNew ? [...PRODUCTS, item] : PRODUCTS.map(x => x.id === p.id ? item : x);
    $("save").disabled = true;
    try { await saveCatalog(list); openAdmin(); } catch (e) { say("Не сохранилось: " + e.message); $("save").disabled = false; }
  };
  if (!isNew) $("del").onclick = async () => {
    if (!confirm("Удалить «" + p.title + "»?")) return;
    try { await saveCatalog(PRODUCTS.filter(x => x.id !== p.id)); openAdmin(); } catch (e) { say("Не удалилось: " + e.message); }
  };
}

$("q").addEventListener("input", render);
$("sort").addEventListener("change", render);
$("orderBtn").addEventListener("click", openCheckout);
$("adminBtn").hidden = !isAdmin;
$("adminBtn").addEventListener("click", openAdmin);
$("grid").addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-inc],[data-dec]"); if (!t) return;
  if (t.dataset.open) openItem(+t.dataset.open);
  else if (t.dataset.inc) change(+t.dataset.inc, 1); else change(+t.dataset.dec, -1);
});
$("dbody").addEventListener("click", e => { const t = e.target.closest("[data-edit]"); if (t) openEdit(t.dataset.edit); });
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) close(); });

render();
if (!demo) api("/catalog").then(d => { if (Array.isArray(d.products)) { PRODUCTS = d.products; render(); } }).catch(() => {});
</script>
</body>
</html>
